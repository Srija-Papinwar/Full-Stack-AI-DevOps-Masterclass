name: continous integration

on:
   workflow_dispatch:
    inputs:
      username:
         description: 'Enter your dockerhub username'
         required: true
      password:
         description: 'Enter your dockerhub password'
         required: true
      version:
         description: 'Enter your docker image version'
         required: true

jobs:
  build_test:
   runs-on: ubuntu-latest

   steps:
      - name: checkout code
        uses: actions/checkout@v7
      - name: Steup jdk
        uses: actions/setup-java@v6.2.0
        with:
          distribution: corretto
          java-version: 21
      - name: Build and test (maven)
        working-directory: docker/app1-hello/springboot/hello-spring
        run: mvn -B clean verify
      - name:  Upload Test Reports
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-reports
          path: docker/app1-hello/springboot/hello-spring/target/surefire-reports

  build_push:
           runs-on: ubuntu-latest
           needs: build_test

           steps:
             - name: Checkout code
               uses: actions/checkout@v7
             - name: Steup jdk
               uses: actions/setup-java@v6.2.0
               with:
                distribution: corretto
                java-version: 21
             - name: build jar for docker
               working-directory: docker/app1-hello/springboot/hello-spring
               run: mvn clean install
             - name: login to dockerhub
               env:
                   username: ${{ inputs.username }}
                   password: ${{ inputs.password }}
               uses: docker/login-action@v4.8.0
               with:
                username: ${username}
                password: ${password}
             - name: build and push docker image
               working-directory: docker/app1-hello/springboot/hello-spring
               env:
                   username: ${{ inputs.username }}
                   version: ${{ inputs.version }}
               run: docker build -t ${username}/myapp:${version} . && docker push ${username}/myapp:${version}
              
